<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Security Dashboard</title>

<style>

body{
    margin:30px;
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

h1{
    text-align:center;
}

.summary{
    display:flex;
    gap:20px;
    margin-bottom:25px;
}

.card{
    flex:1;
    background:#222;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.card h2{
    margin:0;
    font-size:18px;
}

.card p{
    font-size:28px;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#333;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
}

.high{
    background:#5a1515;
}

.medium{
    background:#5d4b14;
}

.low{
    background:#1d5b1d;
}

tr:nth-child(even){
    opacity:0.95;
}

</style>

</head>

<body>

<h1>Security Monitoring Dashboard</h1>

<div class="summary">

<div class="card">
<h2>SSH Failures</h2>
<p id="sshFailure">0</p>
</div>

<div class="card">
<h2>Login Success</h2>
<p id="loginSuccess">0</p>
</div>

<div class="card">
<h2>Root Attacks</h2>
<p id="rootAttack">0</p>
</div>

<div class="card">
<h2>Top Attacking IP</h2>
<p id="topIP">-</p>
</div>

</div>

<table>

<thead>

<tr>

<th>Time</th>

<th>Event Type</th>

<th>Source IP</th>

<th>Severity</th>

<th>MITRE</th>

</tr>

</thead>

<tbody id="events">

</tbody>

</table>

<script>

async function loadEvents(){

    const response = await fetch("/api/events");
    const data = await response.json();

    const table=document.getElementById("events");

    table.innerHTML="";

    let ssh=0;
    let login=0;
    let root=0;

    let ipCount={};

    data.reverse();

    for(let event of data){

        let sev=event.severity.toLowerCase();

        if(event.type.toLowerCase().includes("ssh_failure"))
            ssh++;

        if(event.type.toLowerCase().includes("login_success"))
            login++;

        if(event.type.toLowerCase().includes("root_attack"))
            root++;

        ipCount[event.src_ip]=(ipCount[event.src_ip]||0)+1;

        table.innerHTML += `
        <tr class="${sev}">
            <td>${event.timestamp}</td>
            <td>${event.type}</td>
            <td>${event.src_ip}</td>
            <td>${event.severity}</td>
            <td>${event.mitre}</td>
        </tr>
        `;
    }

    document.getElementById("sshFailure").innerText=ssh;
    document.getElementById("loginSuccess").innerText=login;
    document.getElementById("rootAttack").innerText=root;

    let max=0;
    let top="-";

    for(let ip in ipCount){

        if(ipCount[ip]>max){

            max=ipCount[ip];
            top=ip;

        }

    }

    document.getElementById("topIP").innerText=top;

}

loadEvents();

setInterval(loadEvents,10000);

</script>

</body>

</html>
